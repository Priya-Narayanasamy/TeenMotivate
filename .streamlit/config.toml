# App surfaces are set to the same values the charts draw on, so a chart never
# reads as a grey box floating on a white page. Both modes are defined, so the
# app still follows the browser's light/dark preference — the values here match
# src/effort/theme.py.

[theme]
font = "sans-serif"

[theme.light]
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
primaryColor = "#2a78d6"
linkColor = "#256abf"
borderColor = "#e1e0d9"

[theme.dark]
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#2c2c2a"
textColor = "#ffffff"
primaryColor = "#3987e5"
linkColor = "#6da7ec"
borderColor = "#383835"

[browser]
gatherUsageStats = false
