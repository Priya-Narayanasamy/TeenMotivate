[project]
name = "effort-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.2",
    "pandas>=3.0.5",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# src/ layout: installing the project (editable, via `uv sync`) is what makes
# `import effort` work the same way in the app and in the tests — no sys.path
# juggling in app.py.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/effort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
